name: CloudForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: sachingupta209

jobs:
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./cloudforge
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloudforge-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloudforge-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloudforge-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloudforge-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show Published Images
        run: |
          echo "Backend: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloudforge-backend:latest"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cloudforge-frontend:latest"    
