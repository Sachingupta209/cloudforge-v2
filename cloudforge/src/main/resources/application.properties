spring.application.name=cloudforge

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cloudforge
spring.datasource.username=postgres
spring.datasource.password=1234

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8081

# ===============================
# JWT
# ===============================
jwt.secret=cloudforgeSecretKeyForJwtAuthentication2026CloudForgeProjectSecureKey123
jwt.expiration=86400000